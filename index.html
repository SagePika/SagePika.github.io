  tbody tr.rank-2 { background: rgba(192, 192, 192, 0.18); }
  tbody tr.rank-3 { background: rgba(205, 127, 50, 0.18); }

<script>
(function() {
  let lastVersion = null;
  setInterval(async () => {
    try {
      const res = await fetch('version.json?_=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      if (lastVersion === null) {
        lastVersion = data.version;
      } else if (data.version !== lastVersion) {
        location.reload();
      }
    } catch (e) {}
  }, 3000);
})();
</script>
